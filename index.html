<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00ffcc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEXUS">
  <link rel="manifest" href="manifest.json">
  <title>NEXUS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #header h1 {
      font-size: 20px;
      color: #00ffcc;
      letter-spacing: 4px;
    }

    #status {
      font-size: 10px;
      color: #555;
      letter-spacing: 1px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.blake {
      align-self: flex-end;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
    }

    .message.nexus {
      align-self: flex-start;
      background: #001a15;
      border: 1px solid #00ffcc33;
      color: #e0e0e0;
    }

    .message .label {
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .message.blake .label {
      color: #555;
    }

    .message.nexus .label {
      color: #00ffcc;
    }

    #input-area {
      padding: 12px 16px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 10px 12px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: none;
      border-radius: 4px;
      max-height: 120px;
      outline: none;
    }

    #input:focus {
      border-color: #00ffcc55;
    }

    #send {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }

    #send:active {
      background: #00ccaa;
    }

    .boot-message {
      color: #333;
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>NEXUS</h1>
    <span id="status">PHASE 1 — ONLINE</span>
  </div>

  <div id="chat">
    <p class="boot-message">— SYSTEM INITIALIZED —</p>
    <div class="message nexus">
      <div class="label">NEXUS</div>
      NEXUS online. Phase 1 shell active. API not yet connected — that's Phase 2. Enter a query to confirm the interface is working.
    </div>
  </div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Enter query..."></textarea>
    <button id="send">SEND</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/nexus/sw.js');
    }

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.classList.add('message', role.toLowerCase());
      msg.innerHTML = '<div class="label">' + role.toUpperCase() + '</div>' + text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }

    input.addEventListener('input', autoResize);

    send.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) return;
      appendMessage('BLAKE', text);
      input.value = '';
      input.style.height = 'auto';
      setTimeout(() => {
        appendMessage('NEXUS', 'API not yet connected. Phase 2 will wire this in. Interface confirmed working.');
      }, 300);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send.click();
      }
    });
  </script>

</body>
</html>
