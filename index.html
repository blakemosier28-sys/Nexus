<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00ffcc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEXUS">
  <link rel="manifest" href="manifest.json">
  <title>NEXUS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #header h1 {
      font-size: 20px;
      color: #00ffcc;
      letter-spacing: 4px;
    }

    #status {
      font-size: 10px;
      color: #555;
      letter-spacing: 1px;
    }

    #api-setup {
      padding: 20px 16px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #api-setup label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #00ffcc;
    }

    #api-setup input {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 10px 12px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      border-radius: 4px;
      outline: none;
      width: 100%;
    }

    #api-setup input:focus {
      border-color: #00ffcc55;
    }

    #api-btn {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
    }

    #api-btn:active {
      background: #00ccaa;
    }

    #api-connected {
      display: none;
      padding: 10px 16px;
      border-bottom: 1px solid #1a1a1a;
      font-size: 11px;
      color: #00ffcc;
      letter-spacing: 1px;
      justify-content: space-between;
      align-items: center;
    }

    #clear-key {
      font-size: 10px;
      color: #555;
      cursor: pointer;
      letter-spacing: 1px;
      background: none;
      border: none;
      font-family: 'Courier New', monospace;
    }

    #clear-key:active {
      color: #ff4444;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 92%;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.blake {
      align-self: flex-end;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
    }

    .message.nexus {
      align-self: flex-start;
      background: #001a15;
      border: 1px solid #00ffcc33;
      color: #e0e0e0;
    }

    .message.system {
      align-self: center;
      background: none;
      border: none;
      color: #333;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .message .label {
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .message.blake .label { color: #555; }
    .message.nexus .label { color: #00ffcc; }

    .thinking {
      display: flex;
      gap: 4px;
      padding: 6px 0;
    }

    .thinking span {
      width: 6px;
      height: 6px;
      background: #00ffcc;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    #input-area {
      padding: 12px 16px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 10px 12px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: none;
      border-radius: 4px;
      max-height: 120px;
      outline: none;
    }

    #input:focus { border-color: #00ffcc55; }

    #send {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }

    #send:active { background: #00ccaa; }
    #send:disabled { background: #333; color: #555; cursor: default; }
  </style>
</head>
<body>

  <div id="header">
    <h1>NEXUS</h1>
    <span id="status">AWAITING API KEY</span>
  </div>

  <div id="api-setup">
    <label>ANTHROPIC API KEY</label>
    <input type="password" id="api-key-input" placeholder="Paste your key here...">
    <button id="api-btn">CONNECT</button>
  </div>

  <div id="api-connected">
    <span>● API CONNECTED</span>
    <button id="clear-key">CLEAR KEY</button>
  </div>

  <div id="chat">
    <div class="message system">— SYSTEM INITIALIZED —</div>
  </div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Enter query..." disabled></textarea>
    <button id="send" disabled>SEND</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/nexus/sw.js');
    }

    const SYSTEM_PROMPT = `You are NEXUS, Blake's personal AI research system. 

Who Blake is:
- Works HVAC professionally
- Building an AI integration into Opera Browser for live, multi-source web research
- Part of a broader AI coordination network

How to operate:
- No validation language
- Label opinions as opinions
- Say "I don't know" when uncertain
- Be direct
- Never fill gaps with assumed information — flag unknowns explicitly
- Lead with the answer, explain after
- Detailed but clear — not academic, not oversimplified
- Use examples when they help`;

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const apiSetup = document.getElementById('api-setup');
    const apiConnected = document.getElementById('api-connected');
    const apiKeyInput = document.getElementById('api-key-input');
    const apiBtn = document.getElementById('api-btn');
    const clearKey = document.getElementById('clear-key');
    const status = document.getElementById('status');

    let apiKey = localStorage.getItem('nexus_api_key') || '';
    let conversationHistory = [];
    let isWaiting = false;

    function activateInterface() {
      apiSetup.style.display = 'none';
      apiConnected.style.display = 'flex';
      input.disabled = false;
      send.disabled = false;
      status.textContent = 'PHASE 2 — ONLINE';
      appendMessage('nexus', 'NEXUS online. API connected. Ready for queries.');
    }

    if (apiKey) {
      activateInterface();
    }

    apiBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) return;
      apiKey = key;
      localStorage.setItem('nexus_api_key', key);
      apiKeyInput.value = '';
      activateInterface();
    });

    clearKey.addEventListener('click', () => {
      apiKey = '';
      localStorage.removeItem('nexus_api_key');
      conversationHistory = [];
      apiConnected.style.display = 'none';
      apiSetup.style.display = 'flex';
      input.disabled = true;
      send.disabled = true;
      status.textContent = 'AWAITING API KEY';
      chat.innerHTML = '<div class="message system">— SYSTEM INITIALIZED —</div>';
    });

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.classList.add('message', role);
      if (role !== 'system') {
        msg.innerHTML = '<div class="label">' + role.toUpperCase() + '</div>' + text;
      } else {
        msg.textContent = text;
      }
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return msg;
    }

    function showThinking() {
      const msg = document.createElement('div');
      msg.classList.add('message', 'nexus');
      msg.id = 'thinking';
      msg.innerHTML = '<div class="label">NEXUS</div><div class="thinking"><span></span><span></span><span></span></div>';
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeThinking() {
      const t = document.getElementById('thinking');
      if (t) t.remove();
    }

    async function sendMessage() {
      if (isWaiting) return;
      const text = input.value.trim();
      if (!text) return;

      appendMessage('blake', text);
      conversationHistory.push({ role: 'user', content: text });
      input.value = '';
      input.style.height = 'auto';
      isWaiting = true;
      send.disabled = true;
      showThinking();

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-opus-4-5',
            max_tokens: 1024,
            system: SYSTEM_PROMPT,
            messages: conversationHistory
          })
        });

        const data = await response.json();

        if (data.error) {
          removeThinking();
          appendMessage('nexus', 'ERROR: ' + data.error.message);
        } else {
          const reply = data.content[0].text;
          conversationHistory.push({ role: 'assistant', content: reply });
          removeThinking();
          appendMessage('nexus', reply);
        }
      } catch (err) {
        removeThinking();
        appendMessage('nexus', 'CONNECTION ERROR: ' + err.message);
      }

      isWaiting = false;
      send.disabled = false;
    }

    send.addEventListener('click', sendMessage);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
  </script>

</body>
</html>
