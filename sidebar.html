<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NEXUS</title>
  <style>
    body {
      width: 350px;
      height: 500px;
      margin: 0;
      padding: 10px;
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
    }
    h2 {
      color: #00ffcc;
      margin: 0 0 10px 0;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #333;
      padding: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    #input {
      width: 100%;
      padding: 8px;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #444;
      font-family: monospace;
      font-size: 13px;
      box-sizing: border-box;
    }
    #send {
      margin-top: 6px;
      width: 100%;
      padding: 8px;
      background: #00ffcc;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>NEXUS</h2>
  <div id="chat"></div>
  <textarea id="input" rows="3" placeholder="Enter query..."></textarea>
  <button id="send">SEND</button>
  <script src="sidebar.js"></script>
</body>
</html>
